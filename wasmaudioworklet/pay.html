<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio AI session pass</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #111; color: #ddd;
           margin: 0; padding: 1.5rem; display: flex; justify-content: center; }
    main { max-width: 30rem; width: 100%; }
    h1 { font-size: 1.2rem; margin: 0 0 .3rem; }
    .sub { color: #888; font-size: .85rem; margin: 0 0 1.4rem; }
    .price { font-size: 2rem; font-weight: 600; color: #8f8; }
    .price small { font-size: .8rem; color: #888; font-weight: 400; display: block; }
    button { font: inherit; width: 100%; padding: .8rem 1rem; border-radius: .5rem;
             border: 1px solid #4a4; background: #1a2a1a; color: #8f8;
             cursor: pointer; margin-top: .8rem; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary { border-color: #444; background: #1a1a1a; color: #aaa; }
    .row { display: flex; justify-content: space-between; gap: 1rem;
           font-size: .85rem; padding: .35rem 0; border-bottom: 1px solid #222; }
    .row span:first-child { color: #888; }
    .row span:last-child { font-family: ui-monospace, monospace; text-align: right;
                           word-break: break-all; }
    #msg { margin-top: 1rem; padding: .8rem; border-radius: .5rem; font-size: .85rem;
           line-height: 1.5; display: none; }
    .info { background: #10203a; color: #9cf; display: block !important; }
    .ok   { background: #12280f; color: #9f9; display: block !important; }
    .err  { background: #2c1414; color: #f99; display: block !important; }
    .steps { color: #777; font-size: .78rem; margin-top: 1.2rem; line-height: 1.6; }
  </style>
</head>
<body>
<main>
  <h1>Studio AI session pass</h1>
  <p class="sub">The AI assistant in WebAssembly Music. Everything else in the app stays free.</p>

  <div class="price" id="price">— <small id="pricenote">loading…</small></div>

  <div id="details" style="margin-top:1rem"></div>

  <button id="connect">Connect NEAR wallet</button>
  <button id="claim" disabled style="display:none">Claim your session pass</button>
  <button id="pay" disabled style="display:none">Pay</button>
  <button id="close" class="secondary" style="display:none">Back to the studio</button>

  <div id="msg"></div>

  <p class="steps" id="steps">
    Nothing is stored on our side — the pass lives in this browser and expires on
    its own.
  </p>
</main>

<script type="module">
import {
  createPaymentFetch, claimSponsorPass, loadPass, passRemainingSeconds, passAccountId,
  formatPassDuration, selectRequirements, decodeHeader, PASS_ENDPOINT,
} from './near/x402-client.js';

// Claiming runs against the pass endpoint, which mints without spending any
// inference — asking the model a throwaway question just to discover whether
// you are allowed to ask it would be daft.
const ENDPOINT = PASS_ENDPOINT;
const PROBE = undefined;

const $ = (id) => document.getElementById(id);
const say = (text, cls) => { const m = $('msg'); m.className = cls; m.textContent = text; };
const detail = (k, v) => {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<span></span><span></span>';
  d.children[0].textContent = k; d.children[1].textContent = v;
  $('details').appendChild(d);
};

let connector, wallet, accountId, terms;

// Already paid? Say so rather than charging twice.
const existing = loadPass();
if (passRemainingSeconds(existing) > 0) {
  const left = formatPassDuration(passRemainingSeconds(existing));
  say(`You already have a pass — about ${left} left${passAccountId(existing) ? `, bought by ${passAccountId(existing)}` : ''}.`, 'ok');
  $('connect').style.display = 'none';
  $('close').style.display = '';
}

let sponsorship = null;

async function loadTerms() {
  const res = await fetch(ENDPOINT, { method: 'POST' });
  if (res.status !== 402) {
    say(res.ok ? 'You already have access.' : `Unexpected response ${res.status}.`, 'info');
    return null;
  }
  const body = await res.json().catch(() => ({}));
  sponsorship = body.sponsorship || null;

  // Payment is offered only if this deployment has it switched on; the first
  // iteration gives passes to sponsors instead of selling them.
  const paid = (body.accepts || []).length
    ? selectRequirements(body) : null;

  if (paid) {
    const human = (Number(paid.amount) / 1e6).toFixed(2).replace(/\.00$/, '');
    $('price').firstChild.textContent = `$${human} `;
    $('pricenote').textContent = 'in USDC on NEAR · 30 minutes';
    detail('you pay', `${human} USDC`);
    detail('to', paid.payTo);
    terms = paid;
    $('pay').style.display = '';
  } else if (sponsorship) {
    $('price').firstChild.textContent = 'Free ';
    $('pricenote').textContent = 'for people who have funded this project · 30 minutes';
    detail('open to', `sponsors of ${sponsorship.recipient}`);
    detail('checked against', sponsorship.contract);
    $('claim').style.display = '';
    $('steps').textContent = 'Your wallet will ask once, to sign a message proving the account is '
      + 'yours. No payment, and nothing is sent on chain. Nothing is stored on our side — the pass '
      + 'lives in this browser and expires on its own.';
  } else {
    say('This server is not granting access right now.', 'err');
    return null;
  }
  return paid || sponsorship;
}

$('connect').onclick = async () => {
  $('connect').disabled = true;
  try {
    say('Opening your wallet…', 'info');
    const { NearConnector } = await import('https://cdn.jsdelivr.net/npm/@hot-labs/near-connect@0.11.1/+esm');
    connector = new NearConnector({ network: (terms?.network || 'near:mainnet').split(':')[1] });
    connector.on('wallet:signIn', async (event) => {
      wallet = event.wallet || await connector.wallet();
      accountId = event.accounts?.[0]?.accountId;
      detail('account', accountId || '?');
      say(`Connected as ${accountId}.`, 'ok');
      $('connect').style.display = 'none';
      $('pay').disabled = false;
      $('claim').disabled = false;
    });
    await connector.connect();
  } catch (e) {
    say(`Could not connect: ${e.message}`, 'err');
    $('connect').disabled = false;
  }
};

$('pay').onclick = async () => {
  $('pay').disabled = true;
  const payFetch = createPaymentFetch({
    wallet, accountId,
    onStatus: (s, d) => {
      if (s === 'paying') say('Approve the payment in your wallet…', 'info');
      if (s === 'redeeming') say('Payment sent — confirming on NEAR…', 'info');
      if (s === 'failed') say(`Payment was not accepted: ${d}`, 'err');
    },
  });
  try {
    const res = await payFetch(ENDPOINT, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: PROBE,
    });
    const pass = loadPass();
    if (passRemainingSeconds(pass) > 0) {
      say('Paid. Your pass is active for 30 minutes — you can close this and carry on.', 'ok');
      $('pay').style.display = 'none';
      $('close').style.display = '';
      // The app is listening for this; `storage` does not fire in the tab that
      // wrote it, so nudge any opener explicitly too.
      try { window.opener?.postMessage({ type: 'studio-pass', pass }, location.origin); } catch { /* COOP severed it */ }
      setTimeout(() => window.close(), 2500);
    } else if (res.status !== 402) {
      say(`Payment did not produce a pass (server said ${res.status}).`, 'err');
      $('pay').disabled = false;
    } else {
      $('pay').disabled = false;
    }
  } catch (e) {
    // If the wallet was dismissed AFTER the transfer, the money is gone but the
    // payment is still claimable — the hash must not be lost.
    if (e.unclaimed && e.txHash) {
      say(`Your payment went through (${e.txHash}) but was not claimed. Keep this reference and try Pay again.`, 'err');
    } else {
      say(`Payment failed: ${e.message}`, 'err');
    }
    $('pay').disabled = false;
  }
};

$('claim').onclick = async () => {
  $('claim').disabled = true;
  say('Sign the message in your wallet to prove the account is yours…', 'info');
  try {
    const result = await claimSponsorPass(wallet, sponsorship, { accountId });
    say(`Thank you for supporting the project. Your pass is active for ${formatPassDuration(result.secondsRemaining)}.`, 'ok');
    $('claim').style.display = 'none';
    $('close').style.display = '';
    try { window.opener?.postMessage({ type: 'studio-pass', pass: result.pass }, location.origin); } catch { /* COOP severed it */ }
    setTimeout(() => window.close(), 2500);
  } catch (e) {
    say(/has not funded/.test(e.message)
      ? `${accountId} has not funded this project yet, so there is no pass to claim. `
        + 'Sponsors are read from PotLock — direct donations and matching rounds both count.'
      : `Could not claim: ${e.message}`, 'err');
    $('claim').disabled = false;
  }
};

$('close').onclick = () => { window.close(); location.href = '/'; };

loadTerms().then((r) => {
  if (r) say(sponsorship && !terms
    ? 'Connect the NEAR account you funded the project with.'
    : 'Connect a NEAR wallet holding USDC to continue.', 'info');
});
</script>
</body>
</html>
